<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRCV Smart Print</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JsBarcode library for barcode generation -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- Poppins font (import only required weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        /* Print styles */
        @media print {
            @page {
                size: Legal portrait;
                margin: 0;
            }
            body {
                margin: 0;
                padding: 0;
                background: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-family: 'Poppins', sans-serif !important;
            }
            .no-print, header, nav, #input-section, #print-controls {
                display: none !important;
            }
            #print-area {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                visibility: visible !important;
            }
            #print-area * {
                visibility: visible !important;
            }
        }
        @media screen {
            #print-area { display: none; }
            #print-area.show-preview {
                display: block;
                font-family: 'Poppins', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-20 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <!-- Printer Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900">DRCV Smart Print</h1>
            </div>
            <div class="text-sm font-medium text-gray-500">
                Total Records: <span id="record-count" class="text-blue-600 font-bold">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 no-print">
        
        <!-- Tab Switcher -->
        <div class="flex justify-center mb-8">
            <div class="bg-gray-200 p-1 rounded-xl inline-flex shadow-inner">
                <button id="tab-input" onclick="switchTab('input')" class="flex items-center gap-2 px-6 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-white text-blue-600 shadow-md">
                    <!-- List Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                    Input Data
                </button>
                <button id="tab-print" onclick="switchTab('print')" class="flex items-center gap-2 px-6 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-600 hover:text-gray-900">
                    <!-- Printer Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9" />
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                        <rect x="6" y="14" width="12" height="8" />
                    </svg>
                    Format & Print
                </button>
            </div>
        </div>

        <div id="input-section" class="space-y-6">
            <!-- Input Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Paste SMS Data or Import File</label>
                    <div>
                        <input type="file" id="file-upload" accept=".txt" class="hidden" onchange="handleFileUpload(this)" />
                        <button onclick="document.getElementById('file-upload').click()" class="text-sm text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1 px-3 py-1 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors">
                            Import .txt File
                        </button>
                    </div>
                </div>
                    <textarea id="data-input" oninput="handleInput()" placeholder="Paste text here..." class="border border-gray-300 rounded-xl px-4 py-2 bg-gray-50 font-mono text-sm leading-6 resize-none whitespace-pre overflow-auto w-full outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent h-96"></textarea>
                    <div class="mt-4 flex justify-end">
                        <button onclick="clearData()" id="clear-btn" disabled class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors font-medium text-sm">
                            Clear All
                        </button>
                    </div>
            </div>
            
            <!-- Data Preview Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
                    <h3 class="font-semibold text-gray-900">Data Preview</h3>
                    <span id="dup-count" class="text-xs text-gray-500 bg-white px-2 py-1 rounded border border-gray-200">0 Duplicates Found</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 text-gray-600 uppercase text-xs font-bold tracking-wider">
                            <tr>
                                <th class="px-6 py-3 w-16 text-center">No.</th>
                                <th class="px-6 py-3">Full SMS</th>
                                <th class="px-6 py-3">S/N</th>
                                <th class="px-6 py-3">PIN</th>
                                <th class="px-6 py-3">Value</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Print Controls -->
        <div id="print-controls" class="hidden flex-col items-center">
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 max-w-2xl text-center w-full">
                <h3 class="text-blue-800 font-bold mb-1">Ready to Print</h3>
                <p class="text-blue-600 text-sm mb-4">Click below to print.</p>
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2 mx-auto">
                    Print / Save as PDF
                </button>
            </div>
        </div>
    </main>

    <!-- Print Preview Area (hidden until "Format & Print" is clicked) -->
    <div id="print-area"></div>

        function parseInputText(text) {
            const lines = text.split('\n');
            const tempParsed = [];
            const snCounts = {};
            const pinCounts = {};

            lines.forEach(line => {
                if (line.trim() === '') return;
                const sn = (line.match(/Serial Number:\s*(\d{16})/) || [])[1] || '-';
                const pin = (line.match(/PIN:\s*(\d{17})/) || [])[1] || '-';
                const date = (line.match(/Expiry Date:\s*([\w-]+)/) || [])[1] || '-';
                const denomMatch = line.match(/Denomination:\s*(ATOM\s+\d+K)/i);
                const denominationFull = denomMatch ? denomMatch[1] : 'ATOM 0K';

                let value = '0K';
                let name = 'ATOM';
                const valueMatch = denominationFull.match(/(\d+K)/);
                if (valueMatch) {
                    value = valueMatch[1];
                    name = denominationFull.replace(value, '').trim();
                }

                if (sn !== '-') snCounts[sn] = (snCounts[sn] || 0) + 1;
                if (pin !== '-') pinCounts[pin] = (pinCounts[pin] || 0) + 1;

                tempParsed.push({ full: line, sn, pin, date, name, value });
            });

            // Mark duplicates (if any S/N or PIN appears more than once)
            return tempParsed.map(item => ({
                ...item,
                isDuplicate: (snCounts[item.sn] > 1) || (pinCounts[item.pin] > 1)
            }));
        }

        function handleInput() {
            const text = document.getElementById('data-input').value;
            parsedData = parseInputText(text);
            document.getElementById('record-count').innerText = parsedData.length;
            document.getElementById('clear-btn').disabled = text.length === 0;
            const duplicates = parsedData.filter(d => d.isDuplicate).length;
            document.getElementById('dup-count').innerText = `${duplicates} Duplicates Found`;
            renderTable();
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('data-input').value = e.target.result;
                handleInput();
                input.value = '';
            };
            reader.readAsText(file);
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            if (parsedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-gray-400 italic">No data available.</td></tr>`;
                return;
            }
            tbody.innerHTML = parsedData.map((item, index) => `
                <tr class="${item.isDuplicate ? 'bg-red-50' : 'hover:bg-gray-50'}">
                    <td class="px-6 py-3 font-mono text-gray-500 text-center select-none bg-gray-50/50">${index + 1}</td>
                    <td class="px-6 py-3 max-w-xs truncate text-gray-500" title="${item.full}">${item.full}</td>
                    <td class="px-6 py-3 font-mono">${item.sn}</td>
                    <td class="px-6 py-3 font-mono">${item.pin}</td>
                    <td class="px-6 py-3 font-bold text-blue-600">${item.value}</td>
                </tr>
            `).join('');
        }

        function clearData() {
            if (confirm("Clear all data?")) {
                document.getElementById('data-input').value = '';
                handleInput();
            }
        }

        function switchTab(tab) {
            const inputSection = document.getElementById('input-section');
            const printControls = document.getElementById('print-controls');
            const printArea = document.getElementById('print-area');
            const tabInput = document.getElementById('tab-input');
            const tabPrint = document.getElementById('tab-print');

            if (tab === 'input') {
                inputSection.classList.remove('hidden');
                printControls.classList.add('hidden');
                printControls.classList.remove('flex');
                printArea.classList.remove('show-preview');
                printArea.style.display = 'none';

                tabInput.classList.add('bg-white', 'text-blue-600', 'shadow-md');
                tabInput.classList.remove('text-gray-600');
                tabPrint.classList.remove('bg-white', 'text-blue-600', 'shadow-md');
                tabPrint.classList.add('text-gray-600');
            } else {
                inputSection.classList.add('hidden');
                printControls.classList.remove('hidden');
                printControls.classList.add('flex');
                printArea.style.display = 'block';
                printArea.classList.add('show-preview');

                tabPrint.classList.add('bg-white', 'text-blue-600', 'shadow-md');
                tabPrint.classList.remove('text-gray-600');
                tabInput.classList.remove('bg-white', 'text-blue-600', 'shadow-md');
                tabInput.classList.add('text-gray-600');

                renderPrintArea();
            }
        }

// Generate the printable layout with barcodes
function renderPrintArea() {
    const printArea = document.getElementById('print-area');
    if (parsedData.length === 0) {
        printArea.innerHTML = '<div class="text-center p-10 text-gray-400">No data to print</div>';
        return;
    }

    const containersPerPage = 16;
    let html = '';
    let barcodeQueue = [];
    let i = 0;
    // --- PART 1: FIRST PAGE (COVER PAGE) ---
    // ပထမဆုံး data ရဲ့ Value (1K/5K etc) ကိုယူမယ်
    const detectedValue = parsedData[0] ? parsedData[0].value.trim() : 'DEFAULT';
    
    // သက်ဆိုင်ရာ SVG ကို ရွေးမယ်
    let coverSvg = COVER_IMAGES['DEFAULT'];
    
    // Value ထဲမှာ 1K, 2K, 3K ပါရင် သက်ဆိုင်ရာပုံယူမယ်
    if (detectedValue.includes('1K')) coverSvg = COVER_IMAGES['1K'];
    else if (detectedValue.includes('2K')) coverSvg = COVER_IMAGES['2K'];
    else if (detectedValue.includes('3K')) coverSvg = COVER_IMAGES['3K'];
    else if (detectedValue.includes('5K')) coverSvg = COVER_IMAGES['5K'];

    // 5K ဆိုရင် ၃ ကွက်၊ ကျန်တာဆို ၅ ကွက်
    const isBigBoxCover = detectedValue.includes('5K');
    const recordsInBoxCover = isBigBoxCover ? 3 : 5;

    let coverPage = '';
    
    // Cover Page အတွက် ၁၆ ကွက် ဖန်တီးမယ်
    for (let c = 0; c < containersPerPage; c++) {
        let strips = '';
        // တစ်ကွက်ချင်းစီမှာ SVG ထည့်မယ်
        for (let s = 0; s < recordsInBoxCover; s++) {
            // ဖြတ်မည့် လမ်းကြောင်း (Overlay Line)
            const bottomLineOverlay = (s < recordsInBoxCover - 1) 
                ? `<div style="position:absolute; bottom:0; left:0; width:100%; height:1px; border-bottom:0.5px dashed rgba(0,0,0,0.3); z-index:10; pointer-events:none;"></div>`
                : '';

            strips += `
            <div class="relative flex-1 overflow-hidden" style="margin-bottom: -1px; z-index: 1;">
                
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                    ${coverSvg}
                </div>

                ${bottomLineOverlay}
            </div>`;
        }

        coverPage += `
        <div class="relative flex flex-col" style="width:52.5mm; height:85mm;">
            <div style="position:absolute; inset:0; border:0.1px dashed rgba(0,0,0,0.3); z-index:20; pointer-events:none;"></div>
            
            ${strips}
        </div>`;
    }

    // Cover Page ကို HTML ထဲထည့်မယ်
    html += `
    <div class="grid mx-auto mb-4"
            style="
            width:215.9mm;
            height:355.6mm;
            grid-template-columns:repeat(4,52mm);
            grid-template-rows:repeat(4,85mm);
            justify-content:center;
            align-content:center;
            page-break-after:always;
            ">
        ${coverPage}
    </div>`;

    // Loop through all data
    while (i < parsedData.length) {
        let page = '';

        for (let c = 0; c < containersPerPage; c++) {
            // Stop creating boxes only if we are absolutely done with data and finished the previous box
            if (i >= parsedData.length) break;

            // Determine Box Type (3 slots or 5 slots)
            const isBigBox = parsedData[i].value.includes('5K');
            const recordsInBox = isBigBox ? 3 : 5;
            const cfg = isBigBox ? PRINT_LAYOUT.big : PRINT_LAYOUT.normal;

            let strips = '';

            // Loop to create exactly 3 or 5 slots (Filled or Empty)
            for (let s = 0; s < recordsInBox; s++) {
                
                if (i < parsedData.length) {
                    // --- CASE 1: Real Data Exists ---
                    const item = parsedData[i];
                    const idx = i;                                                                      const duplicateClass = item.isDuplicate ? 'bg-red-200 text-red-700' : '';

                    strips += `
<div class="${duplicateClass} relative flex-1 border-b border-dotted border-gray-400 last:border-b-0">

                        <div style="position:absolute; top:${cfg.sn.top}%; left:${cfg.sn.left}%; font-size:${cfg.sn.fontSize}px;">
                            SN: ${item.sn}
                        </div>

                        <div style="position:absolute; top:${cfg.barcode.top}%; left:0; width:100%; display:flex; justify-content:center;">
                            <div style="transform: translate(-30px, -15px);">
                                <svg id="barcode-${idx}"></svg>
                            </div>
                        </div>

                        <div style="position:absolute; top:${cfg.pin.top}%; left:${cfg.pin.left}%; font-size:${cfg.pin.fontSize}px; letter-spacing:0.05em;">
                            ${item.pin}
                        </div>

                        <div style="position:absolute; top:${cfg.exp.top}%; right:${cfg.exp.right}%; font-size:${cfg.exp.fontSize}px; text-align:right;">
                            Exp: ${item.date}
                        </div>

                        <div style="position:absolute; top:${cfg.name.top}%; right:5%; font-size:${cfg.name.fontSize}px;">
                            ${item.name}
                        </div>

                        <div style="position:absolute; top:${cfg.value.top}%; right:5%; font-size:${cfg.value.fontSize}px;">
                            ${item.value}
                        </div>

                    </div>`;
                    
                    barcodeQueue.push({ id: `barcode-${idx}`, sn: item.sn, cfg });
                    i++; // Move to next data

                } else {
                    // --- CASE 2: No Data (Empty Slot to maintain size) ---
                    strips += `
                    <div class="relative flex-1 border-b border-dotted border-gray-400 last:border-b-0">
                        </div>`;
                }
            }

            page += `
            <div class="border border-dashed border-gray-400 flex flex-col" style="width:52mm; height:85mm;">
                ${strips}
            </div>`;
        }

        html += `
        <div class="grid mx-auto mb-4"
             style="
               width:215.9mm;
               height:355.6mm;
               grid-template-columns:repeat(4,52mm);
               grid-template-rows:repeat(4,85mm);
               justify-content:center;
               align-content:center;
               page-break-after:always;
             ">
          ${page}
        </div>`;
    }

    printArea.innerHTML = html;

    // Generate Barcodes
    setTimeout(() => {
        barcodeQueue.forEach(b => {
            try {
                JsBarcode('#' + b.id, b.sn, {
                    format: 'CODE128',
                    
                    // ဒီနေရာမှာ ဂဏန်းအသေ (1.3) မထားဘဲ b.cfg.barcode.width လို့ ပြောင်းလိုက်ပါ
                    width: b.cfg.barcode.width,  
                    
                    height: b.cfg.barcode.height,
                    displayValue: false,
                    margin: 0
                });
            } catch (e) {
                console.error("Barcode error:", e);
            }
        });
    }, 0);
} // End of renderPrintArea
        
    </script>
